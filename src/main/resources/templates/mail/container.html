<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
</head>
<body style="margin:0; padding:0; background-color:#1d1e2b;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#1d1e2b; padding-top:20px;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" border="0" style="background:#32354b; margin:20px 0; padding:20px; border-radius:4px;">
                <tr>
                    <td align="center" style="font-family:Arial, sans-serif; font-size:24px; font-weight:bold; padding:20px 0; color:#f5f5f5;">
                        {{ title }}
                    </td>
                </tr>
                <tr>
                    <td style="font-family:Arial, sans-serif; font-size:16px; color:#f5f5f5; padding:10px 20px;">
                        {{content}}
                    </td>
                </tr>
            </table>

            <!-- Footer -->
            <table width="600" cellpadding="0" cellspacing="0" border="0" style="font-family:Arial, sans-serif; font-size:12px; color:#999999; text-align:center; padding:10px 0;">
                <tr>
                    <td>
                        {{ currentYear }} Darts
                        ·
                        <a href="{{ urlWeb }}/" style="color:#999999; text-decoration:underline;">Website</a>
                        ·
                        <a href="{{ urlWeb }}/terms" style="color:#999999; text-decoration:underline;">AGB</a>
                        ·
                        <a href="{{ urlWeb }}/impressum" style="color:#999999; text-decoration:underline;">Impressum</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
