spring.application.name=Darts Backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Darts
com.jpromi.darts.files.path=files
com.jpromi.darts.api.domain=https://board.dartcore.net
com.jpromi.darts.web.domain=https://dartcore.net
com.jpromi.darts.app.domain=https://board.dartcore.net
com.jpromi.darts.app.group.max-size=128


# Mail
mail.smtp.host=${SMTP_HOST}
mail.smtp.port=587
mail.username=${SMTP_USER}
mail.password=${SMTP_PASSWD}
mail.smtp.auth=${SMTP_AUTH}
mail.smtp.starttls.enable=${SMTP_STARTTLS}